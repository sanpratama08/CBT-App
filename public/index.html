<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Ujian - CBT SDIT NURUSSIROJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

  <!-- KARTU LOGIN UTAMA -->
  <div class="w-full max-w-sm sm:max-w-md bg-white rounded-3xl shadow-2xl border border-white/20 overflow-hidden p-6 sm:p-8 space-y-5">
    
    <!-- HEADER IDENTITAS SEKOLAH & LOGO -->
    <div class="text-center space-y-2">
      <div class="flex justify-center mb-2">
        <div class="w-20 h-20 bg-emerald-50 border border-emerald-100 rounded-2xl flex items-center justify-center p-2 shadow-md shadow-emerald-600/10">
          <img src="/images/logo.png" alt="Logo SDIT Nurussiroj" style="max-width: 60px; max-height: 60px; width: auto; height: auto; object-fit: contain;">
        </div>
      </div>
      <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight">SDIT NURUSSIROJ</h1>
      <p class="text-[11px] sm:text-xs text-emerald-700 font-semibold uppercase tracking-wider">Ujian Berbasis Komputer (CBT)</p>
    </div>

    <div class="bg-emerald-50/80 border border-emerald-100 rounded-2xl p-3 text-center">
      <p class="text-[11px] sm:text-xs text-emerald-800 font-medium">Silakan masukkan data diri dan token yang diberikan oleh pengawas ujian.</p>
    </div>

    <!-- FORM LOGIN SISWA -->
    <form id="formLogin" class="space-y-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap Siswa</label>
        <input type="text" id="nama" placeholder="Contoh: Ahmad Fauzan" required 
          class="w-full px-4 py-3 text-xs bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nomor Induk / Username</label>
        <input type="text" id="username" placeholder="Contoh: 12345" required 
          class="w-full px-4 py-3 text-xs font-mono bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Token Ujian</label>
        <input type="text" id="token" placeholder="Masukkan token (Cth: KLS5MTK)" required 
          class="w-full px-4 py-3 text-xs font-mono font-bold uppercase tracking-widest bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <button type="submit" id="btnSubmit" 
        class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2 mt-2">
        <span>Mulai Mengerjakan Ujian</span>
        <span>→</span>
      </button>
    </form>

    <!-- FOOTER INFO -->
    <div class="pt-2 border-t border-slate-100 text-center">
      <p class="text-[10px] sm:text-[11px] text-slate-400">Kerjakan dengan jujur, teliti, dan penuh percaya diri.</p>
    </div>

  </div>

  <!-- SCRIPT LOGIC LOGIN -->
  <script>
    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Memeriksa Token...';

      const payload = {
        nama: document.getElementById('nama').value.trim(),
        username: document.getElementById('username').value.trim(),
        token: document.getElementById('token').value.trim().toUpperCase()
      };

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();

        if (result.success) {
          localStorage.setItem('cbt_session', JSON.stringify(result.session));
          window.location.href = '/ujian.html';
        } else {
          alert('Gagal Masuk: ' + (result.message || 'Token tidak valid atau salah.'));
          btn.disabled = false;
          btn.innerHTML = '<span>Mulai Mengerjakan Ujian</span><span>→</span>';
        }
      } catch (err) {
        alert('Terjadi kesalahan koneksi ke server.');
        btn.disabled = false;
        btn.innerHTML = '<span>Mulai Mengerjakan Ujian</span><span>→</span>';
      }
    });
  </script>
</body>
</html>

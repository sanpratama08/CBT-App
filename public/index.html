<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login Ujian - CBT SDIT NURUSSIROJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-gradient-to-br from-emerald-600 via-teal-700 to-slate-900 font-sans text-slate-800 antialiased min-h-screen flex items-center justify-center p-4">

  <!-- CONTAINER TOAST NOTIFIKASI (POJOK KANAN ATAS) -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

  <!-- KARTU LOGIN UTAMA -->
  <div class="w-full max-w-sm sm:max-w-md bg-white rounded-3xl shadow-2xl border border-white/20 overflow-hidden p-6 sm:p-8 space-y-5">
    
    <!-- HEADER IDENTITAS SEKOLAH & LOGO -->
    <div class="text-center space-y-2">
      <div class="flex justify-center mb-2">
        <div class="w-20 h-20 bg-emerald-50 border border-emerald-100 rounded-2xl flex items-center justify-center p-2 shadow-md shadow-emerald-600/10">
          <img src="/images/logo.png" alt="Logo SDIT Nurussiroj" style="max-width: 60px; max-height: 60px; width: auto; height: auto; object-fit: contain;" onerror="this.onerror=null; this.parentElement.innerHTML='🏫';">
        </div>
      </div>
      <h1 class="text-lg sm:text-xl font-bold text-slate-900 tracking-tight font-heading">SDIT NURUSSIROJ</h1>
      <p class="text-[11px] sm:text-xs text-emerald-700 font-semibold uppercase tracking-wider">Ujian Berbasis Komputer (CBT)</p>
    </div>

    <div class="bg-emerald-50/80 border border-emerald-100 rounded-2xl p-3 text-center">
      <p class="text-[11px] sm:text-xs text-emerald-800 font-medium">Silakan masukkan data diri dan token yang diberikan oleh pengawas ujian.</p>
    </div>

    <!-- FORM LOGIN SISWA -->
    <form id="formLogin" class="space-y-3.5">
      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap Siswa</label>
        <input type="text" id="nama" placeholder="Contoh: Ahmad Fauzan" required 
          class="w-full px-4 py-3 text-xs bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Nomor Induk / Username</label>
        <input type="text" id="username" placeholder="Contoh: 12345" required 
          class="w-full px-4 py-3 text-xs font-mono bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <div>
        <label class="block text-xs font-bold text-slate-700 mb-1">Token Ujian</label>
        <input type="text" id="token" placeholder="Masukkan token (Cth: KLS5MTK)" required 
          class="w-full px-4 py-3 text-xs font-mono font-bold uppercase tracking-widest bg-slate-50 border border-slate-200 rounded-2xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none transition">
      </div>

      <button type="submit" id="btnSubmit" 
        class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-[0.99] text-white font-bold py-3.5 rounded-2xl text-xs transition shadow-lg shadow-emerald-600/25 flex items-center justify-center gap-2 mt-2">
        <span>Mulai Mengerjakan Ujian</span>
        <span>→</span>
      </button>
    </form>

    <!-- FOOTER INFO -->
    <div class="pt-2 border-t border-slate-100 text-center">
      <p class="text-[10px] sm:text-[11px] text-slate-400">Kerjakan dengan jujur, teliti, dan penuh percaya diri.</p>
    </div>

  </div>

  <!-- SCRIPT LOGIC LOGIN & TOAST -->
  <script>
    function showToast(message, type = 'success', duration = 3500) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: { bg: 'bg-white border-emerald-500', iconBg: 'bg-emerald-100 text-emerald-600', icon: '✓', title: 'Berhasil' },
        error:   { bg: 'bg-white border-red-500',     iconBg: 'bg-red-100 text-red-600',         icon: '✕', title: 'Gagal Masuk' },
        warning: { bg: 'bg-white border-amber-500',   iconBg: 'bg-amber-100 text-amber-600',     icon: '!', title: 'Perhatian' },
        info:    { bg: 'bg-white border-blue-500',    iconBg: 'bg-blue-100 text-blue-600',       icon: 'i', title: 'Informasi' }
      };

      const s = styles[type] || styles.info;

      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-lg border-l-4 ${s.bg} transform translate-x-full opacity-0 transition-all duration-300`;
      toast.innerHTML = `
        <div class="w-7 h-7 rounded-full ${s.iconBg} flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">${s.icon}</div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold text-slate-800">${s.title}</p>
          <p class="text-xs text-slate-600 mt-0.5 break-words">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 text-xs font-bold px-1">✕</button>
      `;

      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('translate-x-full', 'opacity-0');
      });

      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('btnSubmit');
      btn.disabled = true;
      btn.textContent = 'Memeriksa Token...';

      const payload = {
        nama: document.getElementById('nama').value.trim(),
        username: document.getElementById('username').value.trim(),
        token: document.getElementById('token').value.trim().toUpperCase()
      };

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        
        const result = await res.json();

        if (result.success) {
          localStorage.setItem('cbt_session', JSON.stringify(result.session));
          showToast('Login berhasil! Memuat soal ujian...', 'success');
          setTimeout(() => {
            window.location.href = '/ujian.html';
          }, 1000);
        } else {
          showToast(result.message || 'Token tidak valid atau salah.', 'error', 4500);
          btn.disabled = false;
          btn.innerHTML = '<span>Mulai Mengerjakan Ujian</span><span>→</span>';
        }
      } catch (err) {
        showToast('Terjadi kesalahan koneksi ke server.', 'error');
        btn.disabled = false;
        btn.innerHTML = '<span>Mulai Mengerjakan Ujian</span><span>→</span>';
      }
    });
  </script>
</body>
</html>

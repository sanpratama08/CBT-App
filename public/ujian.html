<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Berlangsung - CBT SDIT NURUSSIROJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen pb-12">

  <!-- NAVBAR ATAS (INFORMASI UJIAN & TIMER) -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-50">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
      <div>
        <h1 id="infoMapel" class="font-bold text-sm sm:text-base">Mata Pelajaran: -</h1>
        <p id="infoSiswa" class="text-xs text-emerald-100">Siswa: - | Kelas: -</p>
      </div>
      <div class="flex items-center gap-3">
        <div class="bg-emerald-800 border border-emerald-600 px-3 py-1.5 rounded-xl text-center">
          <span class="text-[10px] block text-emerald-200 uppercase tracking-wider">Sisa Waktu</span>
          <span id="timer" class="font-mono font-bold text-sm text-yellow-300">00:00:00</span>
        </div>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA UJIAN -->
  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">

    <!-- PERINGATAN ANTI-CHEAT -->
    <div id="warningBanner" class="hidden bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-2xl text-xs font-medium flex items-center justify-between">
      <span>⚠️ Peringatan! Jangan keluar dari halaman ujian. Pelanggaran: <span id="warningCount">0</span>/3</span>
    </div>

    <!-- CONTAINER UTAMA SOAL -->
    <div id="soalContainer" class="space-y-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-500">
        Memuat soal ujian...
      </div>
    </div>

    <!-- TOMBOL SELESAI / SUBMIT -->
    <div class="flex justify-end pt-4">
      <button onclick="konfirmasiSubmit()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3.5 rounded-2xl text-xs sm:text-sm shadow-lg shadow-emerald-600/20 transition active:scale-95">
        Kirim / Selesai Ujian
      </button>
    </div>

  </main>

  <!-- SCRIPT LOGIC UJIAN -->
  <script>
    let session = JSON.parse(localStorage.getItem('cbt_session'));
    if (!session) {
      alert('Sesi login tidak ditemukan. Silakan login kembali.');
      window.location.href = '/index.html';
    }

    document.getElementById('infoSiswa').textContent = `Siswa: ${session.nama} (${session.username}) | Kelas: ${session.kelas}`;
    document.getElementById('infoMapel').textContent = `Mata Pelajaran: ${session.mapel}`;

    let dataPG = [];
    let dataIsian = [];
    let jawabanSiswa = {};
    let warnings = 0;
    let timerInterval;
    let heartbeatInterval;

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Ambil Soal dan Pisahkan Berdasarkan Tipe
    async function muatSoal() {
      try {
        const res = await fetch('/api/ujian/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: session.token })
        });
        const result = await res.json();

        if (result.success) {
          let rawData = result.data;

          // Pisahkan Pilihan Ganda dan Isian berdasarkan properti 'tipe'
          let rawPG = rawData.filter(q => q.tipe !== 'isian');
          let rawIsian = rawData.filter(q => q.tipe === 'isian');

          // Acak soal PG dan acak opsi jawabannya
          dataPG = shuffleArray(rawPG).map(q => ({
            ...q,
            opsi: shuffleArray(q.opsi)
          }));

          // Acak soal Isian Singkat
          dataIsian = shuffleArray(rawIsian);

          renderSoalTerpisah();
          mulaiTimer(result.durasiMenit || 60);
          mulaiHeartbeat();
        } else {
          alert(result.message || 'Gagal memuat soal.');
          window.location.href = '/index.html';
        }
      } catch (err) {
        console.error(err);
        alert('Terjadi kesalahan saat memuat soal ujian.');
      }
    }

    // Render Soal dengan Bagian Terpisah (Bagian I: PG, Bagian II: Isian)
    function renderSoalTerpisah() {
      const container = document.getElementById('soalContainer');
      container.innerHTML = '';

      if (dataPG.length === 0 && dataIsian.length === 0) {
        container.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-slate-500">Tidak ada soal untuk ujian ini.</div>';
        return;
      }

      // --- BAGIAN I: PILIHAN GANDA ---
      if (dataPG.length > 0) {
        const sectionPG = document.createElement('div');
        sectionPG.className = 'space-y-6';
        sectionPG.innerHTML = `
          <div class="bg-emerald-800 text-white px-5 py-3 rounded-2xl shadow-sm font-bold text-sm tracking-wide">
            BAGIAN I: PILIHAN GANDA
          </div>
        `;

        dataPG.forEach((q, index) => {
          let opsiHTML = q.opsi.map(opt => {
            const isChecked = jawabanSiswa[q.id] === opt.key ? 'checked' : '';
            return `
              <label class="flex items-start gap-3 p-3 bg-slate-50 hover:bg-emerald-50/50 border border-slate-200 rounded-xl cursor-pointer transition">
                <input type="radio" name="soal_${q.id}" value="${opt.key}" ${isChecked} onchange="simpanJawaban('${q.id}', '${opt.key}')" class="mt-0.5 text-emerald-600 focus:ring-emerald-500">
                <span class="text-xs sm:text-sm text-slate-700 font-medium"><b>${opt.key}.</b> ${opt.text}</span>
              </label>
            `;
          }).join('');

          const card = document.createElement('div');
          card.className = 'bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4';
          card.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">Soal No. ${index + 1}</span>
            </div>
            <div class="text-xs sm:text-sm text-slate-800 font-medium leading-relaxed">
              ${q.pertanyaan}
            </div>
            ${q.gambar_soal ? `<div class="my-2"><img src="${q.gambar_soal}" class="max-h-48 rounded-xl border border-slate-200 object-contain"></div>` : ''}
            <div class="space-y-2 mt-3">${opsiHTML}</div>
          `;
          sectionPG.appendChild(card);
        });
        container.appendChild(sectionPG);
      }

      // --- BAGIAN II: ISIAN SINGKAT ---
      if (dataIsian.length > 0) {
        const sectionIsian = document.createElement('div');
        sectionIsian.className = 'space-y-6 pt-4';
        sectionIsian.innerHTML = `
          <div class="bg-teal-800 text-white px-5 py-3 rounded-2xl shadow-sm font-bold text-sm tracking-wide">
            BAGIAN II: ISIAN SINGKAT
          </div>
        `;

        dataIsian.forEach((q, index) => {
          const val = jawabanSiswa[q.id] || '';
          const card = document.createElement('div');
          card.className = 'bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4';
          card.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <span class="text-xs font-bold text-teal-700 bg-teal-50 px-3 py-1 rounded-full">Soal No. ${index + 1}</span>
            </div>
            <div class="text-xs sm:text-sm text-slate-800 font-medium leading-relaxed">
              ${q.pertanyaan}
            </div>
            ${q.gambar_soal ? `<div class="my-2"><img src="${q.gambar_soal}" class="max-h-48 rounded-xl border border-slate-200 object-contain"></div>` : ''}
            <div class="mt-3">
              <label class="block text-[11px] font-semibold text-slate-500 mb-1">Jawaban Singkat:</label>
              <input type="text" placeholder="Ketik jawaban Anda di sini..." 
                value="${val}"
                oninput="simpanJawaban('${q.id}', this.value)"
                class="w-full sm:w-2/3 p-3 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none transition">
            </div>
          `;
          sectionIsian.appendChild(card);
        });
        container.appendChild(sectionIsian);
      }
    }

    function simpanJawaban(idSoal, nilai) {
      jawabanSiswa[idSoal] = nilai;
    }

    function mulaiTimer(durasiMenit) {
      let totalDetik = durasiMenit * 60;
      timerInterval = setInterval(() => {
        if (totalDetik <= 0) {
          clearInterval(timerInterval);
          alert('Waktu ujian telah habis! Ujian akan dikumpulkan otomatis.');
          submitUjian();
          return;
        }
        totalDetik--;
        let jam = Math.floor(totalDetik / 3600);
        let menit = Math.floor((totalDetik % 3600) / 60);
        let detik = totalDetik % 60;
        document.getElementById('timer').textContent = 
          `${String(jam).padStart(2, '0')}:${String(menit).padStart(2, '0')}:${String(detik).padStart(2, '0')}`;
      }, 1000);
    }

    function mulaiHeartbeat() {
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          warnings++;
          document.getElementById('warningBanner').classList.remove('hidden');
          document.getElementById('warningCount').textContent = warnings;
          
          if (warnings >= 3) {
            alert('Anda telah keluar halaman sebanyak 3 kali. Ujian otomatis dikumpulkan!');
            submitUjian();
          }
        }
      });

      heartbeatInterval = setInterval(async () => {
        try {
          const answeredCount = Object.keys(jawabanSiswa).length;
          const totalSoal = dataPG.length + dataIsian.length;
          await fetch('/api/ujian/heartbeat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: session.username,
              nama: session.nama,
              kelas: session.kelas,
              mapel: session.mapel,
              answeredCount,
              totalQuestions: totalSoal,
              warnings,
              status: 'Mengerjakan'
            })
          });
        } catch (e) {
          console.error('Heartbeat error:', e);
        }
      }, 10000);
    }

    function konfirmasiSubmit() {
      const totalSoal = dataPG.length + dataIsian.length;
      const terisi = Object.keys(jawabanSiswa).length;
      if (confirm(`Anda telah menjawab ${terisi} dari ${totalSoal} soal. Yakin ingin mengumpulkan ujian sekarang?`)) {
        submitUjian();
      }
    }

    async function submitUjian() {
      clearInterval(timerInterval);
      clearInterval(heartbeatInterval);

      try {
        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nama: session.nama,
            username: session.username,
            kelas: session.kelas,
            mapel: session.mapel,
            jawabanSiswa
          })
        });
        const result = await res.json();

        if (result.success) {
          alert(`Ujian Berhasil Dikumpulkan!\nNilai Anda: ${result.nilai} (Benar ${result.benar} dari ${result.totalSoal} soal).`);
          localStorage.removeItem('cbt_session');
          window.location.href = '/index.html';
        } else {
          alert('Gagal mengirim jawaban: ' + (result.message || 'Terjadi kesalahan.'));
        }
      } catch (err) {
        console.error(err);
        alert('Gagal terhubung ke server saat mengirim jawaban.');
      }
    }

    muatSoal();
  </script>
</body>
</html>

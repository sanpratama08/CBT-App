<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Berlangsung - CBT SDIT NURUSSIROJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800 antialiased min-h-screen pb-12">

  <!-- CONTAINER TOAST NOTIFIKASI -->
  <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-3 max-w-sm w-full pointer-events-none"></div>

  <!-- MODAL KONFIRMASI MODERN -->
  <div id="custom-modal-backdrop" class="fixed inset-0 bg-slate-900/50 backdrop-blur-xs z-50 hidden items-center justify-center p-4 transition-opacity duration-200 opacity-0">
    <div id="custom-modal-box" class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 transform scale-95 transition-transform duration-200">
      <div class="flex items-start gap-4">
        <div id="modal-icon" class="w-10 h-10 rounded-full bg-amber-100 text-amber-600 flex items-center justify-center shrink-0 text-lg font-bold">!</div>
        <div class="flex-1">
          <h3 id="modal-title" class="text-base font-bold text-slate-800 font-heading">Konfirmasi Tindakan</h3>
          <p id="modal-message" class="text-xs text-slate-600 mt-1.5 leading-relaxed">Apakah Anda yakin?</p>
        </div>
      </div>
      <div class="mt-6 flex justify-end gap-2.5">
        <button id="modal-btn-cancel" class="px-4 py-2 rounded-xl text-xs font-semibold text-slate-600 bg-slate-100 hover:bg-slate-200 transition">Batal</button>
        <button id="modal-btn-confirm" class="px-4 py-2 rounded-xl text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-xs transition">Ya, Lanjutkan</button>
      </div>
    </div>
  </div>

  <!-- NAVBAR ATAS -->
  <header class="bg-emerald-700 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-4xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-2">
      <div>
        <h1 id="infoMapel" class="font-bold text-sm sm:text-base font-heading">Mata Pelajaran: -</h1>
        <p id="infoSiswa" class="text-xs text-emerald-100">Siswa: - | Kelas: -</p>
      </div>
      <div class="bg-emerald-800 border border-emerald-600 px-3 py-1.5 rounded-xl text-center">
        <span class="text-[10px] block text-emerald-200 uppercase tracking-wider">Sisa Waktu</span>
        <span id="timer" class="font-mono font-bold text-sm text-yellow-300">00:00:00</span>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="max-w-4xl mx-auto px-4 mt-6 space-y-6">
    <div id="warningBanner" class="hidden bg-amber-50 border border-amber-200 text-amber-800 p-3 rounded-2xl text-xs font-medium flex items-center justify-between">
      <span>⚠️ Peringatan! Jangan keluar dari halaman ujian. Pelanggaran: <span id="warningCount">0</span>/3</span>
    </div>

    <div id="soalContainer" class="space-y-8">
      <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 text-center text-slate-500">
        Memuat soal ujian...
      </div>
    </div>

    <div class="flex justify-end pt-4">
      <button onclick="konfirmasiSubmit()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3.5 rounded-2xl text-xs sm:text-sm shadow-lg shadow-emerald-600/20 transition active:scale-95">
        Kirim / Selesai Ujian
      </button>
    </div>
  </main>

  <script>
    function showToast(message, type = 'success', duration = 3500) {
      const container = document.getElementById('toast-container');
      if (!container) return;

      const styles = {
        success: { bg: 'bg-white border-emerald-500', iconBg: 'bg-emerald-100 text-emerald-600', icon: '✓', title: 'Berhasil' },
        error:   { bg: 'bg-white border-red-500',     iconBg: 'bg-red-100 text-red-600',         icon: '✕', title: 'Peringatan' },
        warning: { bg: 'bg-white border-amber-500',   iconBg: 'bg-amber-100 text-amber-600',     icon: '!', title: 'Perhatian' },
        info:    { bg: 'bg-white border-blue-500',    iconBg: 'bg-blue-100 text-blue-600',       icon: 'i', title: 'Informasi' }
      };

      const s = styles[type] || styles.info;
      const toast = document.createElement('div');
      toast.className = `pointer-events-auto flex items-start gap-3 p-4 rounded-2xl shadow-lg border-l-4 ${s.bg} transform translate-x-full opacity-0 transition-all duration-300`;
      toast.innerHTML = `
        <div class="w-7 h-7 rounded-full ${s.iconBg} flex items-center justify-center font-bold text-xs shrink-0 mt-0.5">${s.icon}</div>
        <div class="flex-1 min-w-0">
          <p class="text-xs font-bold text-slate-800">${s.title}</p>
          <p class="text-xs text-slate-600 mt-0.5 break-words">${message}</p>
        </div>
        <button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-slate-600 text-xs font-bold px-1">✕</button>
      `;

      container.appendChild(toast);
      requestAnimationFrame(() => toast.classList.remove('translate-x-full', 'opacity-0'));
      setTimeout(() => {
        toast.classList.add('translate-x-full', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, duration);
    }

    function showConfirm(message, title = 'Konfirmasi', confirmText = 'Ya, Lanjutkan', isDanger = false) {
      return new Promise((resolve) => {
        const backdrop = document.getElementById('custom-modal-backdrop');
        const box = document.getElementById('custom-modal-box');
        const btnConfirm = document.getElementById('modal-btn-confirm');
        const btnCancel = document.getElementById('modal-btn-cancel');
        const iconEl = document.getElementById('modal-icon');

        document.getElementById('modal-title').textContent = title;
        document.getElementById('modal-message').textContent = message;
        btnConfirm.textContent = confirmText;

        if (isDanger) {
          btnConfirm.className = 'px-4 py-2 rounded-xl text-xs font-semibold text-white bg-red-600 hover:bg-red-700 shadow-xs transition';
          iconEl.className = 'w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center shrink-0 text-lg font-bold';
        } else {
          btnConfirm.className = 'px-4 py-2 rounded-xl text-xs font-semibold text-white bg-emerald-600 hover:bg-emerald-700 shadow-xs transition';
          iconEl.className = 'w-10 h-10 rounded-full bg-emerald-100 text-emerald-600 flex items-center justify-center shrink-0 text-lg font-bold';
        }

        backdrop.classList.remove('hidden');
        backdrop.classList.add('flex');
        requestAnimationFrame(() => {
          backdrop.classList.remove('opacity-0');
          box.classList.remove('scale-95');
        });

        const close = (result) => {
          backdrop.classList.add('opacity-0');
          box.classList.add('scale-95');
          setTimeout(() => {
            backdrop.classList.add('hidden');
            backdrop.classList.remove('flex');
            resolve(result);
          }, 200);
        };

        btnConfirm.onclick = () => close(true);
        btnCancel.onclick = () => close(false);
      });
    }

    let session = JSON.parse(localStorage.getItem('cbt_session'));
    if (!session) {
      window.location.href = '/index.html';
    } else {
      document.getElementById('infoSiswa').textContent = `Siswa: ${session.nama} (${session.username}) | Kelas: ${session.kelas}`;
      document.getElementById('infoMapel').textContent = `Mata Pelajaran: ${session.mapel}`;
    }

    let dataPG = [];
    let dataIsian = [];
    let jawabanSiswa = {};
    let warnings = 0;
    let timerInterval, heartbeatInterval;

    async function muatSoal() {
      try {
        const res = await fetch('/api/ujian/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: session.token })
        });
        const result = await res.json();

        if (result.success) {
          let rawData = result.data;
          dataPG = rawData.filter(q => q.tipe !== 'isian');
          dataIsian = rawData.filter(q => q.tipe === 'isian');

          renderSoalTerpisah();
          mulaiTimer(result.durasiMenit || 60);
          mulaiHeartbeat();
        } else {
          showToast(result.message || 'Gagal memuat soal.', 'error');
          setTimeout(() => { window.location.href = '/index.html'; }, 2000);
        }
      } catch (err) {
        console.error(err);
        showToast('Terjadi kesalahan saat memuat soal ujian.', 'error');
      }
    }

    function renderSoalTerpisah() {
      const container = document.getElementById('soalContainer');
      container.innerHTML = '';

      if (dataPG.length === 0 && dataIsian.length === 0) {
        container.innerHTML = '<div class="bg-white p-6 rounded-2xl text-center text-slate-500">Tidak ada soal untuk ujian ini.</div>';
        return;
      }

      if (dataPG.length > 0) {
        const sectionPG = document.createElement('div');
        sectionPG.className = 'space-y-6';
        sectionPG.innerHTML = `<div class="bg-emerald-800 text-white px-5 py-3 rounded-2xl shadow-sm font-bold text-sm tracking-wide">BAGIAN I: PILIHAN GANDA</div>`;

        dataPG.forEach((q, index) => {
          let opsiHTML = q.opsi.map(optText => {
            const isChecked = jawabanSiswa[q.id] === optText ? 'checked' : '';
            return `
              <label class="flex items-start gap-3 p-3 bg-slate-50 hover:bg-emerald-50/50 border border-slate-200 rounded-xl cursor-pointer transition">
                <input type="radio" name="soal_${q.id}" value="${optText}" ${isChecked} onchange="simpanJawaban('${q.id}', '${optText}')" class="mt-0.5 text-emerald-600 focus:ring-emerald-500">
                <span class="text-xs sm:text-sm text-slate-700 font-medium">${optText}</span>
              </label>
            `;
          }).join('');

          const card = document.createElement('div');
          card.className = 'bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4';
          card.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <span class="text-xs font-bold text-emerald-700 bg-emerald-50 px-3 py-1 rounded-full">Soal No. ${index + 1}</span>
            </div>
            <div class="text-xs sm:text-sm text-slate-800 font-medium leading-relaxed">${q.pertanyaan}</div>
            ${q.gambar_soal ? `<div class="my-2"><img src="${q.gambar_soal}" class="max-h-48 rounded-xl border object-contain"></div>` : ''}
            <div class="space-y-2 mt-3">${opsiHTML}</div>
          `;
          sectionPG.appendChild(card);
        });
        container.appendChild(sectionPG);
      }

      if (dataIsian.length > 0) {
        const sectionIsian = document.createElement('div');
        sectionIsian.className = 'space-y-6 pt-4';
        sectionIsian.innerHTML = `<div class="bg-teal-800 text-white px-5 py-3 rounded-2xl shadow-sm font-bold text-sm tracking-wide">BAGIAN II: ISIAN SINGKAT</div>`;

        dataIsian.forEach((q, index) => {
          const val = jawabanSiswa[q.id] || '';
          const card = document.createElement('div');
          card.className = 'bg-white p-5 sm:p-6 rounded-2xl shadow-sm border border-slate-200 space-y-4';
          card.innerHTML = `
            <div class="flex items-center justify-between border-b border-slate-100 pb-3">
              <span class="text-xs font-bold text-teal-700 bg-teal-50 px-3 py-1 rounded-full">Soal No. ${index + 1}</span>
            </div>
            <div class="text-xs sm:text-sm text-slate-800 font-medium leading-relaxed">${q.pertanyaan}</div>
            ${q.gambar_soal ? `<div class="my-2"><img src="${q.gambar_soal}" class="max-h-48 rounded-xl border object-contain"></div>` : ''}
            <div class="mt-3">
              <input type="text" placeholder="Ketik jawaban Anda di sini..." 
                value="${val}"
                oninput="simpanJawaban('${q.id}', this.value)"
                class="w-full sm:w-2/3 p-3 text-xs sm:text-sm bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-teal-500 focus:outline-none transition">
            </div>
          `;
          sectionIsian.appendChild(card);
        });
        container.appendChild(sectionIsian);
      }
    }

    function simpanJawaban(idSoal, nilai) {
      jawabanSiswa[idSoal] = nilai;
    }

    function hitungSoalTerjawab() {
      let answered = 0;
      const total = dataPG.length + dataIsian.length;
      for (let id in jawabanSiswa) {
        if (jawabanSiswa[id] !== undefined && String(jawabanSiswa[id]).trim() !== '') {
          answered++;
        }
      }
      return { answered, total };
    }

    function mulaiTimer(durasiMenit) {
      let totalDetik = durasiMenit * 60;
      timerInterval = setInterval(() => {
        if (totalDetik <= 0) {
          clearInterval(timerInterval);
          showToast('Waktu ujian habis! Ujian dikumpulkan otomatis.', 'warning', 5000);
          submitUjian();
          return;
        }
        totalDetik--;
        let jam = Math.floor(totalDetik / 3600);
        let menit = Math.floor((totalDetik % 3600) / 60);
        let detik = totalDetik % 60;
        document.getElementById('timer').textContent = `${String(jam).padStart(2, '0')}:${String(menit).padStart(2, '0')}:${String(detik).padStart(2, '0')}`;
      }, 1000);
    }

    function mulaiHeartbeat() {
      // Kirim heartbeat berkala tiap 5 detik agar kedeteksi di admin
      heartbeatInterval = setInterval(async () => {
        try {
          const { answered, total } = hitungSoalTerjawab();
          await fetch('/api/ujian/heartbeat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: session.username,
              nama: session.nama,
              kelas: session.kelas,
              mapel: session.mapel,
              answeredCount: answered,
              totalQuestions: total,
              warnings: warnings,
              status: 'Mengerjakan'
            })
          });
        } catch (err) {
          console.error('Gagal kirim heartbeat:', err);
        }
      }, 5000);

      // Deteksi keluar tab / pindah jendela
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          warnings++;
          document.getElementById('warningBanner').classList.remove('hidden');
          document.getElementById('warningCount').textContent = warnings;
          showToast(`Peringatan! Anda meninggalkan halaman ujian (${warnings}/3).`, 'warning');
          
          const { answered, total } = hitungSoalTerjawab();
          fetch('/api/ujian/heartbeat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              username: session.username,
              nama: session.nama,
              kelas: session.kelas,
              mapel: session.mapel,
              answeredCount: answered,
              totalQuestions: total,
              warnings: warnings,
              status: warnings >= 3 ? 'Diskualifikasi 3x' : 'Mengerjakan'
            })
          }).then(r => r.json()).then(res => {
            if (res.forceSubmit || warnings >= 3) {
              showToast('Anda keluar halaman sebanyak 3 kali. Ujian dikumpulkan otomatis!', 'error', 5000);
              submitUjian();
            }
          }).catch(e => console.error(e));
        }
      });
    }

    async function konfirmasiSubmit() {
      // Hitung jumlah soal total dan yang sudah diisi
      const totalSoal = dataPG.length + dataIsian.length;
      let terjawab = 0;
      
      for (let id in jawabanSiswa) {
        if (jawabanSiswa[id] !== undefined && String(jawabanSiswa[id]).trim() !== '') {
          terjawab++;
        }
      }

      // Jika masih ada soal yang kosong, tolak dan beri peringatan
      if (terjawab < totalSoal) {
        const sisaKosong = totalSoal - terjawab;
        showToast(`Masih ada ${sisaKosong} soal yang belum Anda isi! Silakan selesaikan semua soal terlebih dahulu.`, 'warning', 5000);
        return; // Menghentikan proses submit
      }

      // Jika semua sudah terisi, lanjutkan konfirmasi pengumpulan
      const yakin = await showConfirm(`Semua (${totalSoal}) soal telah dijawab. Yakin ingin mengumpulkan ujian sekarang?`, 'Konfirmasi Pengumpulan', 'Ya, Kirim Ujian', false);
      if (yakin) {
        submitUjian();
      }
    }

    async function submitUjian() {
      clearInterval(timerInterval);
      clearInterval(heartbeatInterval);
      
      try {
        const { answered, total } = hitungSoalTerjawab();
        // Laporkan status selesai ke server monitoring
        await fetch('/api/ujian/heartbeat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: session.username,
            nama: session.nama,
            kelas: session.kelas,
            mapel: session.mapel,
            answeredCount: answered,
            totalQuestions: total,
            warnings: warnings,
            status: 'Selesai'
          })
        });

        const res = await fetch('/api/submit', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ nama: session.nama, username: session.username, kelas: session.kelas, mapel: session.mapel, jawabanSiswa })
        });
        const result = await res.json();
        if (result.success) {
          showToast(`Ujian Selesai! Nilai Anda: ${result.nilai} (Benar ${result.benar} dari ${result.totalSoal} soal).`, 'success', 6000);
          localStorage.removeItem('cbt_session');
          setTimeout(() => {
            window.location.href = '/index.html';
          }, 3500);
        } else {
          showToast('Gagal mengirim jawaban: ' + (result.message || 'Kesalahan server'), 'error');
        }
      } catch (err) {
        showToast('Kesalahan jaringan saat mengirim jawaban.', 'error');
      }
    }

    muatSoal();
  </script>
</body>
</html>

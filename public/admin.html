<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admin - CBT SDIT NURUSSIROJ</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts Modern: Inter & Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    h1, h2, h3, h4, .font-heading { font-family: 'Plus Jakarta Sans', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-12">

  <!-- NAVBAR / HEADER ADMIN -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
      <div>
        <h1 class="text-lg sm:text-xl font-extrabold text-slate-900 tracking-tight">CBT Admin Dashboard</h1>
        <p class="text-[11px] sm:text-xs text-slate-500 font-medium">SDIT Nurussiroj • Manajemen Ujian & Token Berkala</p>
      </div>

      <!-- PROFIL ADMIN & FOTO -->
      <div class="flex items-center gap-3">
        <div class="text-right hidden sm:block">
          <div class="font-bold text-slate-800 text-sm">Sandi Ali Pratama</div>
          <div class="text-[11px] text-emerald-600 font-medium flex items-center justify-end gap-1.5">
            <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
            Sistem Online
          </div>
        </div>
        <!-- Foto Profil Admin -->
        <div class="w-10 h-10 rounded-full overflow-hidden border border-slate-300 shadow-sm bg-slate-100 flex items-center justify-center">
          <img src="/images/admin.jpg" alt="Foto Admin" class="w-full h-full object-cover">
        </div>
      </div>
    </div>
  </header>

  <!-- KONTEN UTAMA DASHBOARD -->
  <main class="max-w-7xl mx-auto px-4 mt-6 space-y-6">

    <!-- BAGIAN 1: KELOLA TOKEN BERKALA -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- Form Buat Token -->
      <div class="bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="font-heading font-bold text-sm text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
          <span>🔑</span> Buat / Update Token Berkala
        </h2>
        
        <form id="formToken" class="space-y-3.5">
          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Jenjang Kelas</label>
            <input type="text" id="kelasToken" placeholder="Contoh: Kelas 5" required 
              class="w-full px-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Mata Pelajaran</label>
            <input type="text" id="mapelToken" placeholder="Contoh: Matematika" required 
              class="w-full px-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Kode Token Ujian</label>
            <input type="text" id="kodeToken" placeholder="Contoh: KLS5MTK" required 
              class="w-full px-3 py-2.5 text-xs font-mono font-bold uppercase tracking-wider bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <div>
            <label class="block text-xs font-bold text-slate-700 mb-1">Durasi Ujian (Menit)</label>
            <input type="number" id="durasiToken" value="60" required 
              class="w-full px-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
          </div>

          <!-- Tambahan Jam Mulai & Jam Selesai (Token Berkala) -->
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Jam Mulai</label>
              <input type="time" id="jamMulaiToken" 
                class="w-full px-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
            <div>
              <label class="block text-xs font-bold text-slate-700 mb-1">Jam Selesai</label>
              <input type="time" id="jamSelesaiToken" 
                class="w-full px-3 py-2.5 text-xs bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>
          </div>

          <button type="submit" 
            class="w-full bg-emerald-600 hover:bg-emerald-700 active:scale-95 text-white font-bold py-3 rounded-xl text-xs transition shadow-lg shadow-emerald-600/20 mt-2">
            Simpan Token Berkala
          </button>
        </form>
      </div>

      <!-- Tabel Daftar Token Aktif -->
      <div class="lg:col-span-2 bg-white p-6 rounded-3xl shadow-sm border border-slate-200 space-y-4">
        <h2 class="font-heading font-bold text-sm text-slate-900 flex items-center gap-2 border-b border-slate-100 pb-3">
          <span>📋</span> Daftar Token Ujian Aktif & Jadwal Berkala
        </h2>

        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead>
              <tr class="bg-slate-50 text-[11px] font-bold text-slate-600 uppercase tracking-wider border-b border-slate-200">
                <th class="p-3">Kelas</th>
                <th class="p-3">Mapel</th>
                <th class="p-3">Token</th>
                <th class="p-3">Durasi</th>
                <th class="p-3">Jadwal Aktif (WIB)</th>
                <th class="p-3 text-center">Aksi</th>
              </tr>
            </thead>
            <tbody id="tabelConfig" class="text-xs divide-y divide-slate-100">
              <tr>
                <td colspan="6" class="p-4 text-center text-slate-400">Memuat data token...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

  </main>

  <!-- SCRIPT LOGIC ADMIN -->
  <script>
    async function muatConfig() {
      try {
        const res = await fetch('/api/admin/config');
        const data = await res.json();
        if (data.success) {
          const tbody = document.getElementById('tabelConfig');
          tbody.innerHTML = '';

          if (data.configs.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-slate-400">Belum ada token yang dibuat.</td></tr>`;
            return;
          }

          data.configs.forEach(c => {
            const jadwal = (c.jamMulai && c.jamSelesai) ? `${c.jamMulai} - ${c.jamSelesai}` : 'Sepanjang Hari';
            const tr = document.createElement('tr');
            tr.className = 'hover:bg-slate-50 transition';
            tr.innerHTML = `
              <td class="p-3 font-medium text-slate-800">${c.kelas}</td>
              <td class="p-3 text-slate-600">${c.mapel}</td>
              <td class="p-3 font-mono font-bold text-emerald-700 bg-emerald-50/50 rounded">${c.token}</td>
              <td class="p-3 text-slate-600">${c.durasiMenit} Menit</td>
              <td class="p-3 text-slate-600 font-medium">${jadwal}</td>
              <td class="p-3 text-center">
                <button onclick="hapusToken('${c.token}')" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-3 py-1.5 rounded-lg font-bold text-[11px] transition">Hapus</button>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error('Gagal memuat config:', err);
      }
    }

    document.getElementById('formToken').addEventListener('submit', async (e) => {
      e.preventDefault();
      const payload = {
        kelas: document.getElementById('kelasToken').value.trim(),
        mapel: document.getElementById('mapelToken').value.trim(),
        token: document.getElementById('kodeToken').value.trim().toUpperCase(),
        durasiMenit: parseInt(document.getElementById('durasiToken').value, 10),
        jamMulai: document.getElementById('jamMulaiToken').value,
        jamSelesai: document.getElementById('jamSelesaiToken').value
      };

      try {
        const res = await fetch('/api/admin/config', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const result = await res.json();
        if (result.success) {
          alert('Token berkala berhasil disimpan!');
          document.getElementById('formToken').reset();
          muatConfig();
        } else {
          alert('Gagal: ' + result.message);
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan.');
      }
    });

    async function hapusToken(token) {
      if (!confirm(`Yakin ingin menghapus token ${token}?`)) return;
      try {
        const res = await fetch(`/api/admin/config/${token}`, { method: 'DELETE' });
        const result = await res.json();
        if (result.success) {
          muatConfig();
        } else {
          alert('Gagal menghapus token.');
        }
      } catch (err) {
        alert('Terjadi kesalahan jaringan.');
      }
    }

    muatConfig();
  </script>
</body>
</html>
